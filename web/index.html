<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>EdgeTTS ProX Studio</title>
    <script type="text/javascript" src="/eel.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e2e; color: #cdd6f4; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: #313244; padding: 25px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: #89b4fa; margin-bottom: 5px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .box { background: #181825; padding: 15px; border-radius: 8px; border: 1px solid #45475a; margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 13px; color: #a6adc8; }
        input[type="text"], input[type="number"], select, input[type="file"] { width: 100%; padding: 8px; margin-bottom: 12px; background: #1e1e2e; color: #cdd6f4; border: 1px solid #585b70; border-radius: 4px; box-sizing: border-box; }
        .slider-group { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .slider-group input[type="range"] { flex-grow: 1; }
        .slider-val { width: 45px; text-align: right; font-size: 12px; color: #f9e2af; }
        .checkbox-label { display: flex; align-items: center; gap: 10px; cursor: pointer; color: #f38ba8; font-weight: bold; margin-bottom: 10px; }
        input[type="checkbox"] { transform: scale(1.2); }
        .btn-start { width: 100%; padding: 15px; background: #a6e3a1; color: #11111b; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-start:hover { background: #94e2d5; }
        .btn-dict { background: #cba6f7; color: #11111b; width: 100%; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-stop { width: 100%; padding: 10px; background: #f38ba8; color: #11111b; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        #progress-box { margin-top: 20px; padding: 15px; background: #181825; border-radius: 8px; text-align: center; display: none; border: 1px solid #89b4fa; }
        .progress-bar-container { width: 100%; background: #313244; height: 20px; border-radius: 10px; margin-top: 10px; overflow: hidden; }
        #progress-fill { height: 100%; background: #a6e3a1; width: 0%; transition: width 0.3s; }
        .range-panel { display: flex; gap: 10px; align-items: center; background:#313244; padding: 10px; border-radius: 6px; margin-bottom: 15px;}
        .range-panel input { margin-bottom: 0; }
        .section-title { margin-top:0; border-bottom: 1px solid #45475a; padding-bottom: 8px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎙️ EdgeTTS ProX</h1>
    <p style="text-align: center; color: #a6adc8;">Аудиокниги • Словари • Видео Shorts</p>

    <div class="grid">
        <div>
            <div class="box">
                <h3 class="section-title" style="color:#f9e2af;">📚 Файл и Диапазон</h3>
                <label>Книга (EPUB, PDF, TXT)</label>
                <input type="file" id="bookFile" accept=".epub,.pdf,.txt">
                
                <label>Папка сохранения проекта</label>
                <input type="text" id="bookName" value="Моя_Книга">

                <div class="range-panel">
                    <label style="margin:0; width:60px;">С главы:</label>
                    <input type="number" id="startCh" value="1" min="1">
                    <label style="margin:0;">по:</label>
                    <input type="number" id="endCh" placeholder="Все">
                </div>
            </div>

            <div class="box">
                <h3 class="section-title" style="color:#89b4fa;">🗣️ Настройки Голоса</h3>
                
                <label>Режим работы (Онлайн / Оффлайн)</label>
                <select id="modeSelect" onchange="updateVoices()">
                    <option value="online">Онлайн (Edge TTS)</option>
                    <option value="offline">Оффлайн (Piper / SAPI5)</option>
                </select>

                <label>Основной голос</label>
                <select id="voiceSelect"></select>

                <label>Второй голос (для диалогов "—")</label>
                <select id="voiceDiagSelect"></select>

                <label>Скорость: <span id="rateVal" class="slider-val">0%</span></label>
                <div class="slider-group">
                    <input type="range" id="rate" min="-50" max="50" value="0" oninput="document.getElementById('rateVal').innerText = (this.value > 0 ? '+'+this.value : this.value) + '%'">
                </div>

                <label>Громкость: <span id="volVal" class="slider-val">0%</span></label>
                <div class="slider-group">
                    <input type="range" id="vol" min="-50" max="50" value="0" oninput="document.getElementById('volVal').innerText = (this.value > 0 ? '+'+this.value : this.value) + '%'">
                </div>

                <label>Звуковой эффект (Для глав и словаря)</label>
                <select id="fxType">
                    <option value="none">Без эффектов</option>
                    <option value="classic">Классический ПИК-ПИК</option>
                    <option value="apollo">Космос (Apollo)</option>
                    <option value="zvei">Спецслужбы (ZVEI)</option>
                </select>
                
                <label>Количество потоков (Нагрузка на CPU)</label>
                <input type="number" id="workers" value="3" min="1" max="10">
            </div>
        </div>

        <div>
            <div class="box">
                <h3 class="section-title" style="color:#cba6f7;">🎬 Настройки видео</h3>
                
                <label class="checkbox-label">
                    <input type="checkbox" id="makeVideo"> 🎥 Создать видеоряд
                </label>

                <label>Обложка (JPG/PNG)</label>
                <input type="file" id="coverFile" accept=".jpg,.png">

                <label>Ускорение видеокарты (Кодек)</label>
                <select id="encoderType">
                    <option value="amd">AMD Radeon (AMF)</option>
                    <option value="nvidia">NVIDIA (NVENC)</option>
                    <option value="cpu">Процессор (CPU - Медленно)</option>
                </select>

                <div style="background: #45475a; padding: 10px; border-radius: 6px; margin-top: 10px;">
                    <label class="checkbox-label" style="color: #89dceb; margin-bottom: 5px;">
                        <input type="checkbox" id="isShorts"> 📱 Нарезка для Shorts / TikTok
                    </label>
                    <div id="shortsDurationBlock" style="display:none;">
                        <label>Длительность отрезков (сек):</label>
                        <input type="number" id="shortsDuration" value="50" min="10" max="60">
                    </div>
                </div>
            </div>

            <div class="box">
                <h3 class="section-title" style="color:#a6e3a1;">📖 Словарь (CSV/Excel)</h3>
                <label>Файл словаря (Слово - Перевод)</label>
                <input type="file" id="dictFile" accept=".csv,.xlsx,.xls">
                <label>Пауза между словами (мсек)</label>
                <input type="number" id="dictDelay" value="1000">
                
                <label class="checkbox-label" style="color: #a6e3a1; margin-top: 10px;">
                    <input type="checkbox" id="mergeDict"> 🧩 Объединить всё в один файл
                </label>
                
                <button class="btn-dict" onclick="startDictionary()">⚙️ СГЕНЕРИРОВАТЬ СЛОВАРЬ</button>
            </div>
        </div>
    </div>

    <button class="btn-start" onclick="startProcess()">🚀 ЗАПУСТИТЬ КНИГУ</button>

    <div id="progress-box">
        <h3 id="status-text" style="margin:0; color:#f9e2af;">Подготовка файлов...</h3>
        <p id="chapter-text" style="color:#a6adc8;">Чтение данных</p>
        <div class="progress-bar-container">
            <div id="progress-fill"></div>
        </div>
        <button class="btn-stop" onclick="eel.stop_process()">⛔ ЭКСТРЕННАЯ ОСТАНОВКА</button>
    </div>
</div>

<script>
    // Показать/скрыть настройки Shorts
    document.getElementById('isShorts').addEventListener('change', function() {
        document.getElementById('shortsDurationBlock').style.display = this.checked ? 'block' : 'none';
    });

    // Загрузка абсолютно ВСЕХ языков мира с отображением локали
    async function updateVoices() {
        let mode = document.getElementById('modeSelect').value;
        let sel1 = document.getElementById('voiceSelect');
        let sel2 = document.getElementById('voiceDiagSelect');
        
        sel1.innerHTML = ''; 
        sel2.innerHTML = '<option value="">--- Нет (Один голос) ---</option>';
        
        if (mode === 'online') {
            let voices = await eel.get_voices()();
            voices.forEach(v => {
                sel1.add(new Option(`${v.name} [${v.locale}]`, v.name));
                sel2.add(new Option(`${v.name} [${v.locale}]`, v.name));
            });
        } else {
            let voices = await eel.get_offline_voices()();
            voices.forEach(v => {
                sel1.add(new Option(`${v.name} [${v.locale}]`, v.name));
                sel2.add(new Option(`${v.name} [${v.locale}]`, v.name));
            });
        }
    }

    window.onload = updateVoices;

    // Конвертер файлов для передачи в Python
    function getBase64(file) {
        return new Promise((resolve, reject) => {
            if(!file) { resolve(null); return; }
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    // Подсчет глав при загрузке книги
    document.getElementById('bookFile').addEventListener('change', async function() {
        let file = this.files[0];
        let endChInput = document.getElementById('endCh');
        
        if (!file) {
            endChInput.placeholder = "Все";
            return;
        }
        
        endChInput.placeholder = "Считаю...";
        let b64 = await getBase64(file);
        let info = await eel.get_book_info(file.name, b64)();
        
        if (info && info.count) {
            endChInput.placeholder = "Всего: " + info.count;
            endChInput.max = info.count;
        } else {
            endChInput.placeholder = "Все";
        }
    });

    // Запуск обработки книги
    async function startProcess() {
        let bookFile = document.getElementById('bookFile').files[0];
        if (!bookFile) { alert("Выберите файл книги!"); return; }

        document.getElementById('progress-box').style.display = 'block';
        
        let bookB64 = await getBase64(bookFile);
        let coverFile = document.getElementById('coverFile').files[0];
        let coverB64 = coverFile ? await getBase64(coverFile) : null;

        let r_val = document.getElementById('rate').value;
        let v_val = document.getElementById('vol').value;
        let str_rate = (r_val >= 0 ? "+" + r_val : r_val) + "%";
        let str_vol = (v_val >= 0 ? "+" + v_val : v_val) + "%";

        eel.synthesize_epub(
            bookFile.name, bookB64, 
            document.getElementById('voiceSelect').value,
            document.getElementById('voiceDiagSelect').value,
            str_rate, str_vol, "+0Hz", 
            document.getElementById('workers').value,
            document.getElementById('bookName').value,
            document.getElementById('modeSelect').value,
            document.getElementById('makeVideo').checked,
            coverB64, 
            document.getElementById('encoderType').value,
            null, "10", 
            document.getElementById('fxType').value,
            document.getElementById('isShorts').checked,
            parseInt(document.getElementById('shortsDuration').value) || 50,
            document.getElementById('startCh').value,
            document.getElementById('endCh').value
        );

        checkProgress();
    }

    // Запуск обработки словаря
    async function startDictionary() {
        let dictFile = document.getElementById('dictFile').files[0];
        if (!dictFile) { alert("Выберите CSV или Excel файл!"); return; }
        
        document.getElementById('progress-box').style.display = 'block';
        let dictB64 = await getBase64(dictFile);
        
        let v_val = document.getElementById('vol').value;
        let str_vol = (v_val >= 0 ? "+" + v_val : v_val) + "%";
        
        // Читаем новые параметры: галочку объединения и звуковой эффект
        let mergeAll = document.getElementById('mergeDict').checked;
        let fxType = document.getElementById('fxType').value;

        eel.process_dictionary(
            dictB64, dictFile.name,
            document.getElementById('voiceSelect').value,
            document.getElementById('voiceDiagSelect').value || document.getElementById('voiceSelect').value,
            document.getElementById('bookName').value,
            document.getElementById('dictDelay').value,
            document.getElementById('modeSelect').value,
            str_vol,
            mergeAll,
            fxType
        );
        
        checkProgress();
    }

    // Шкала прогресса
    function checkProgress() {
        let interval = setInterval(async () => {
            let s = await eel.get_progress()();
            document.getElementById('status-text').innerText = s.status === 'running' ? `Обработка: ${s.done} из ${s.total} задач` : (s.status === 'done' ? '✅ УСПЕШНО ЗАВЕРШЕНО!' : 'Ожидание...');
            document.getElementById('chapter-text').innerText = `Текущая задача: ${s.chapter}`;
            document.getElementById('progress-fill').style.width = `${s.pct || 0}%`;
            if (s.status === 'done' || s.status === 'stopped' || s.status === 'error') clearInterval(interval);
        }, 1000);
    }
</script>
</body>
</html>
